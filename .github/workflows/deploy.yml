name: Deploy LinkSuwon

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt pytest

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=.. python -m pytest tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest

    env:
      LINKSUWON_SERVICE_NAME: linksuwon
      LINKSUWON_WEB_ROOT: /var/www/linksuwon
      LINKSUWON_API_HEALTH_URL: http://127.0.0.1:5002/api/v1/health

    steps:
      - name: Deploy to LinkSuwon server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: LINKSUWON_SERVICE_NAME,LINKSUWON_WEB_ROOT,LINKSUWON_API_HEALTH_URL
          script: |
            set -euo pipefail

            cd /home/ubuntu/services/linksuwon

            git fetch origin main
            git reset --hard origin/main

            .venv/bin/python -m pip install -r requirements.txt
            .venv/bin/python -m pip install -r backend/requirements.txt

            cd frontend
            npm ci
            npm run build

            sudo rsync -a --delete dist/ "$LINKSUWON_WEB_ROOT/"

            sudo systemctl restart "$LINKSUWON_SERVICE_NAME"

            sleep 2

            curl --fail --silent --show-error "$LINKSUWON_API_HEALTH_URL"
            curl --fail --silent --show-error \
              https://linksuwon.everytriplog.com/api/v1/health