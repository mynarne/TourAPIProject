<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1464d2" />
    <title>오프라인 - LinkSuwon</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px; text-align: center; }
      .icon { font-size: 56px; }
      h1 { margin: 20px 0 10px; }
      p { color: #64748b; line-height: 1.7; }
      button { border: 0; border-radius: 12px; background: #1464d2; color: white; cursor: pointer; font-weight: 700; padding: 13px 20px; }
    </style>
  </head>
  <body><main><div class="icon">📶❌</div><h1>인터넷 연결을 확인해 주세요</h1><p>관광지 조회, 로그인, 챗봇, 기록 저장과 지도는 인터넷 연결이 필요합니다. 연결이 복구되면 다시 시도해 주세요.</p><button type="button" onclick="location.reload()">다시 시도</button></main></body>
</html>
