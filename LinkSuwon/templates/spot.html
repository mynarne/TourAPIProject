{% extends 'base.html' %}

{% block title %}
    {{ _('brand_title') }} - {{ _('menu_attractions') }}
{% endblock %}

{% block extra_css %}
<style>
    /* Hide scrollbar for sleek list */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    main {
        padding-top: 60px;
    }
</style>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/spot.js') }}" defer></script>
{% endblock %}

{% block content %}
<!-- Main Content: Two-Pane Layout -->
<div class="flex-grow flex w-full max-w-[1440px] mx-auto overflow-hidden relative" style="height: calc(100vh - 60px);">
    
    <!-- Left Pane: List View (Mobile: Toggleable, Desktop: 40% width) -->
    <aside id="list-pane" class="w-full md:w-[40%] max-w-[500px] h-full bg-surface-container-lowest flex flex-col z-10 shadow-lg border-r border-outline-variant/20 relative">
        
        <!-- Tab Bar (Mobile Only) -->
        <div class="flex md:hidden border-b border-outline-variant/20 bg-white">
            <button onclick="switchMobileTab('list')" id="mobile-tab-list" class="flex-1 py-3 text-center font-bold text-sm text-secondary border-b-2 border-secondary">
                📋 {{ _('tab_list') }}
            </button>
            <button onclick="switchMobileTab('map')" id="mobile-tab-map" class="flex-1 py-3 text-center font-bold text-sm text-on-surface-variant">
                🗺️ {{ _('tab_map') }}
            </button>
        </div>

        <!-- Search Bar (Mobile & List View Left Pane) -->
        <div class="p-4 border-b border-outline-variant/10 shrink-0 bg-white">
            <div class="w-full bg-surface-container-low rounded-2xl p-2 flex items-center border border-outline-variant/20 focus-within:border-secondary transition-all">
                <span class="material-symbols-outlined text-primary ml-2 mr-2">search</span>
                <input id="spot-search-input" oninput="filterPlaces()" class="flex-1 bg-transparent border-none focus:ring-0 text-sm text-on-surface placeholder:text-outline py-1.5 outline-none" 
                       placeholder="{{ _('placeholder_search') }}" type="text" value="{{ request.args.get('search', '') }}">
            </div>
            <!-- ✅ GPS 정렬 제어 바 추가 -->
            <div class="mt-3 flex justify-between items-center text-xs text-on-surface-variant">
                <button id="gps-sort-btn" onclick="toggleGpsSort()" 
                        class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/30 bg-surface-container hover:bg-outline-variant/30 font-bold transition-all text-on-surface-variant cursor-pointer">
                    <span class="material-symbols-outlined text-[15px]">my_location</span>
                    <span id="gps-btn-text">
                        {% if current_lang == 'kor' %}내 위치 기준 정렬{% elif current_lang == 'eng' %}Sort by Distance{% elif current_lang == 'jpn' %}距離順に整列{% elif current_lang == 'chs' %}按距离排序{% else %}按距離排序{% endif %}
                    </span>
                </button>
                <span id="gps-status" class="italic text-[10px] text-outline"></span>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar border-b border-outline-variant/10 shrink-0 bg-white">
            <button onclick="filterCategory('all')" id="cat-all" class="cat-btn px-4 py-1.5 bg-primary text-on-primary rounded-full text-xs font-bold whitespace-nowrap shadow-sm ring-1 ring-primary transition-all">
                {{ _('cat_all') }}
            </button>
            <button onclick="filterCategory('exchange')" id="cat-exchange" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {% if current_lang == 'kor' %}💵 환전/ATM
                {% elif current_lang == 'eng' %}💵 Exchange & ATM
                {% elif current_lang == 'jpn' %}💵 両替/ATM
                {% elif current_lang == 'chs' %}💵 换钱/ATM
                {% else %}💵 換錢/ATM{% endif %}
            </button>
            <button onclick="filterCategory('heritage')" id="cat-heritage" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_heritage') }}
            </button>
            <button onclick="filterCategory('museum')" id="cat-museum" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_museum') }}
            </button>
            <button onclick="filterCategory('market')" id="cat-market" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_market') }}
            </button>
            <button onclick="filterCategory('nature')" id="cat-nature" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_nature') }}
            </button>
            <button onclick="filterCategory('food')" id="cat-food" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_food') }}
            </button>
            <button onclick="filterCategory('festival')" id="cat-festival" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_festival') }}
            </button>
            <button onclick="filterCategory('stay')" id="cat-stay" class="cat-btn px-4 py-1.5 bg-surface hover:bg-surface-variant/50 text-on-surface rounded-full text-xs font-bold whitespace-nowrap ring-1 ring-outline-variant/30 transition-all">
                {{ _('cat_stay') }}
            </button>
        </div>

        <!-- Scrollable Cards List -->
        <div id="places-list-container" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar pb-24 md:pb-4">
            <!-- JS에서 동적으로 바인딩됩니다. -->
        </div>
    </aside>

    <!-- Right Pane: Map View (Mobile: Toggleable, Desktop: 60% width) -->
    <section id="map-pane" class="hidden md:block flex-1 relative bg-surface-variant h-full">
        <!-- Naver Map Container -->
        <div id="naver-map" class="absolute inset-0 w-full h-full"></div>

        <!-- AI Floating Action Button (FAB) -->
        <a href="{{ url_for('chatbot.chat_home', lang=current_lang) }}" class="absolute bottom-8 right-8 bg-surface-container-lowest text-primary rounded-full p-3.5 shadow-lg flex items-center justify-center ring-1 ring-outline-variant/10 hover:scale-105 transition-transform group z-20 text-decoration-none">
            <span class="material-symbols-outlined text-[26px] group-hover:text-secondary transition-colors">smart_toy</span>
            <span class="ml-2 font-bold text-sm pr-2 group-hover:text-secondary transition-colors">AI Guide</span>
        </a>
    </section>

</div>

<!-- 명소 상세 비동기 바텀시트 / 서랍장 (Drawer) -->
<div id="spot-drawer" class="fixed bottom-0 left-0 w-full bg-white shadow-2xl rounded-t-3xl transform translate-y-full transition-transform duration-300 ease-out z-50 overflow-y-auto" style="max-height: 85vh; max-width: 500px; left: 50%; translate: -50% 0;">
    <div class="flex justify-center py-3 border-b cursor-pointer" onclick="closeDrawer()">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
    </div>
    <div id="drawer-content" class="p-5">
        <!-- 동적 로드 -->
    </div>
</div>

<!-- 드롭바 뒷배경 블러 레이어 -->
<div id="drawer-backdrop" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden z-40" onclick="closeDrawer()"></div>

<script id="spot-data" type="application/json">
    {{ items | tojson }}
</script>
{% endblock %}
