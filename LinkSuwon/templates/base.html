<!DOCTYPE html>
<html lang="{{ 'ko' if current_lang == 'kor' else 'en' if current_lang == 'eng' else 'ja' if current_lang == 'jpn' else 'zh' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} LinkSuwon {% endblock %}</title>

    <link rel="manifest" href="{{ url_for('static', filename='pwa/manifest.json') }}">
    <meta name="theme-color" content="#1a2b3c">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    
    {% block extra_css %}{% endblock %}

    <script type="text/javascript" 
        src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId={{ ncp_id }}&language={{ 'ko' if current_lang == 'kor' else 'en' if current_lang == 'eng' else 'ja' if current_lang == 'jpn' else 'zh_cn' if current_lang == 'chs' else 'zh_tw' }}">
    </script>
    
    {% block scripts %}{% endblock %}
</head>
<body class="bg-light">
    {% include 'includes/header.html' %}
    
    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

    <script>
        // PWA 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='pwa/service-worker.js') }}")
                    .then(registration => {
                        console.log('서비스 워커 등록 성공:', registration.scope);
                    })
                    .catch(error => {
                        console.log('서비스 워커 등록 실패:', error);
                    });
            });
        }
    </script>
</body>
</html>
